# Theme

include current-theme.conf

# Fonts

font_family       JetBrainsMonoNL Nerd Font
bold_italic_font  auto
font_size         16.0

# Cursor

cursor_shape          block
cursor_blink_interval 0.5

# Window

window_padding_width    10
confirm_os_window_close 0

# Background

background_opacity  0.9
background_blur     1

# Tabs

tab_bar_style           powerline
tab_powerline_style     slanted
tab_activity_symbol     "🚀"
active_tab_font_style   bold
inactive_tab_font_style normal

# Clipboard

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Let macOS handle DPI scaling per-monitor automatically
macos_option_as_alt yes

# This is the key setting — tells kitty to adjust for display DPI
# 'x' = use the display's native DPI factor
macos_quit_when_last_window_closed yes

# Force kitty to re-render when moved between displays
resize_in_steps no

# Neovim scrollback

allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten '/Users/mihajlo.pavlovic/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'

# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
