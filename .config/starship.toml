# Don't print a new line at the start of the prompt
add_newline = true
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

palette = 'catppuccin_macchiato'

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$directory$git_branch $character"""

right_format = """
$hostname$cmd_duration"""

[fill]
symbol = '-'
style = 'fg:crust'

# Replace the "❯" symbol in the prompt with "➜"
[character] # The name of the module we are configuring is "character"
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg: rosewater"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
# format = " 󰜥 [](bold fg:peach)[$symbol $branch(:$remote_branch)](fg:crust bg:peach)[ ](bold fg:peach)"
format = " 󰜥 [$symbol $branch(:$remote_branch)](fg:blue)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[](bold fg:surface0)[$hostname](bg:surface0 bold fg:lavender)[](bold fg:surface0)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:peach fg:crust"
style_root = "red bold"
format = "[](bold fg:peach)[$user]($style)[](bold fg:peach)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "fg:blue"
truncation_length = 2
truncation_symbol = ".../"
# format = '[](bold fg:peach)[󰉋 → $path]($style)[](bold fg:peach)'
format = '[$path]($style)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:surface0)[󰪢 $duration](bold bg:surface0 fg:peach)[](bold fg:surface0)'

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
