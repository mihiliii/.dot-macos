# Don't print a new line at the start of the prompt
add_newline = true
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

palette = 'catppuccin_macchiato'

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$directory$git_branch $character
"""

right_format = """
$hostname\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$cmd_duration\
"""

[fill]
symbol = '-'
style = 'fg:crust'

# Replace the "❯" symbol in the prompt with "➜"
[character] # The name of the module we are configuring is "character"
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg: rosewater"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [$symbol $branch(:$remote_branch)](fg:blue)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[](bold fg:surface0)[$hostname](bg:surface0 bold fg:lavender)[](bold fg:surface0)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:peach fg:crust"
style_root = "red bold"
format = "[](bold fg:peach)[$user]($style)[](bold fg:peach)"
disabled = false
show_always = true

[directory]
read_only = "  "
style = "fg:blue"
truncation_length = 2
truncation_symbol = ".../"
format = '[$path]($style)'

[cmd_duration]
min_time = 0
format = '[](bold fg:surface0)[󰪢 $duration](bold bg:surface0 fg:peach)[](bold fg:surface0)'

[nodejs]
symbol = ""
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $version)](fg:green bg:surface0)]($style)[](bold fg:surface0)'

[bun]
symbol = ""
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $version)](fg:green bg:surface0)]($style)[](bold fg:surface0)'

[c]
symbol = " "
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $version)](fg:green bg:surface0)]($style)[](bold fg:surface0)'

[rust]
symbol = ""
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $version)](fg:green bg:surface0)]($style)[](bold fg:surface0)'

[golang]
symbol = ""
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $version)](fg:green bg:surface0)]($style)[](bold fg:surface0)'

[php]
symbol = ""
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $version)](fg:green bg:surface0)]($style)[](bold fg:surface0)'

[java]
symbol = " "
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $version)](fg:green bg:surface0)]($style)[](bold fg:surface0)'

[kotlin]
symbol = ""
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $version)](fg:green bg:surface0)]($style)[](bold fg:surface0)'

[haskell]
symbol = ""
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $version)](fg:green bg:surface0)]($style)[](bold fg:surface0)'

[python]
symbol = ""
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $version)(\(#$virtualenv\))](fg:green bg:surface0)]($style)[](bold fg:surface0)'

[docker_context]
symbol = ""
style = "bg:surface0"
format = '[](bold fg:surface0)[[$symbol( $context)](fg:sapphire bg:surface0)]($style)[](bold fg:surface0)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[](bold fg:surface0)[$symbol$environment]($style)[](bold fg:surface0)'
ignore_base = false

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
